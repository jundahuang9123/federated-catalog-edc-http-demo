# Local catalog-only stack. The fixed credentials are intentionally limited to local demos.
name: federated-catalog-http-demo-local
services:
  catalog:
    build: .
    environment:
      CATALOG_MODE: http-demo
      EDC_DEMO_PARTICIPANTS: >-
        {"urn:connector:participant-a":
        "a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1",
        "urn:connector:participant-b":
        "b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2"}
      FUSEKI_URL: http://fuseki:3030/catalog
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: local-demo-only
    depends_on:
      fuseki:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  fuseki:
    build: ../deploy/fuseki
    image: federated-catalog-fuseki:6.3.0
    environment:
      ADMIN_PASSWORD: local-demo-only
      JVM_ARGS: -Xmx1g
    volumes:
      - local-index:/fuseki
      - ../deploy/fuseki.ttl:/fuseki/config.ttl:ro
    ports:
      - "127.0.0.1:3030:3030"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u admin:$$ADMIN_PASSWORD --data-urlencode 'query=ASK {}'
          http://localhost:3030/catalog/query > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  local-index:
