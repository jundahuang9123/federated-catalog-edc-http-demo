<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Query the catalog</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav aria-label="Main navigation"><a href="/">Datasets</a> · <a href="/sparql.html">SPARQL</a> · <a href="/status.html">Status</a></nav>
      <h1>Query the catalog</h1>
      <label for="examples">Example query</label>
      <select id="examples"></select>
      <label for="query">SPARQL query</label>

      <button id="run" type="button">Run query</button>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="results" class="query-results"></div>

    <script src="/sparql.js" type="module"></script>
