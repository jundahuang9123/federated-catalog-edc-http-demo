name: Demo verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: catalog/constraints.txt
      - name: Install catalog test dependencies
        run: pip install -c catalog/constraints.txt -e './catalog[dev]'
      - name: Lint catalog
        run: |
          ruff check catalog scripts publisher
          ruff format --check catalog scripts publisher
      - name: Run catalog tests
        run: pytest -q
        working-directory: catalog
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify resource graph model
        run: node --test catalog/tests/graph.test.mjs
      - name: Run EDC HTTP simulator tests
        run: python -m unittest -v scripts.test_edc_http_simulator

      - name: Verify AAS metadata exporter
        run: python -m unittest -v scripts.test_aas_to_dcat
      - name: Run individual publisher tests
        run: python -m unittest discover -s publisher -p 'test_*.py' -v

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create non-secret CI configuration
        run: |
          cat > .env <<'EOF'
          CATALOG_HOST=catalog.demo.invalid
          ACME_EMAIL=ci@demo.invalid
          CATALOG_MODE=http-demo
          CATALOG_PUBLIC_URL=https://catalog.demo.invalid
          CATALOG_CORS_ORIGINS=
          EDC_DEMO_PARTICIPANTS={"urn:connector:participant-a":"a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1","urn:connector:participant-b":"b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2"}
          FUSEKI_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF
      - name: Validate operator and Compose configuration
        run: |
          python3 scripts/check_config.py
          docker compose config --quiet
          docker compose -f docker-compose.integration.yml config --quiet
          docker compose -f catalog/docker-compose.yaml config --quiet
          docker compose -f publisher/compose.yaml config --quiet
      - name: Build individual publisher
        run: docker compose -f publisher/compose.yaml build
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e CATALOG_HOST=catalog.demo.invalid \
            -e ACME_EMAIL=ci@demo.invalid \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated catalog and Fuseki integration test
        run: python3 scripts/integration_test.py
