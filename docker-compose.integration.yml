# Standalone, disposable test stack. Never use these fixed credentials publicly.
services:
  catalog:
    build: ./catalog
    environment:
      CATALOG_MODE: http-demo
      CATALOG_STARTUP_WAIT_SECONDS: "90"
      EDC_DEMO_PARTICIPANTS: >-
        {"urn:connector:participant-a":
        "a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1",
        "urn:connector:participant-b":
        "b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2"}
      FUSEKI_URL: http://fuseki:3030/catalog
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: integration-only
      FUSEKI_TIMEOUT_SECONDS: "3"
    ports: ["127.0.0.1::8000"]
    depends_on:
      fuseki:
        condition: service_healthy
  fuseki:
    build: ./deploy/fuseki
    image: federated-catalog-fuseki:6.3.0
    environment:
      ADMIN_PASSWORD: integration-only
      JVM_ARGS: -Xmx1g
    volumes:
      - test-index:/fuseki
      - ./deploy/fuseki.ttl:/fuseki/config.ttl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u admin:$$ADMIN_PASSWORD --data-urlencode 'query=ASK {}'
          http://localhost:3030/catalog/query > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  test-index:
