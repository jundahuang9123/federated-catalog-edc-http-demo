name: federated-catalog-http-demo
services:
  catalog:
    build: ./catalog
    restart: unless-stopped
    env_file: .env
    environment:
      CATALOG_DEPLOYMENT: production
      CATALOG_MODE: http-demo
      FUSEKI_URL: http://fuseki:3030/catalog
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:?Set a strong Fuseki password}
      EDC_DEMO_PARTICIPANTS: ${EDC_DEMO_PARTICIPANTS:?Set participant IDs and demo tokens}
      CATALOG_PUBLIC_URL: https://${CATALOG_HOST:?Set the catalog hostname}
      CATALOG_CORS_ORIGINS: ${CATALOG_CORS_ORIGINS:-}
      CATALOG_MAX_INGEST_BYTES: ${CATALOG_MAX_INGEST_BYTES:-2097152}
    command: ["uvicorn", "core.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--workers", "1", "--limit-concurrency", "32"]
    depends_on:
      fuseki:
        condition: service_healthy
    networks: [edge, index]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=25)"]
      interval: 30s
      timeout: 30s
      start_period: 90s
      retries: 3
  fuseki:
    build: ./deploy/fuseki
    image: federated-catalog-fuseki:6.3.0
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:?Set a strong Fuseki password}
      JVM_ARGS: -Xmx1g
    volumes:
      - fuseki-data:/fuseki
      - ./deploy/fuseki.ttl:/fuseki/config.ttl:ro
    networks: [index]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u admin:$$ADMIN_PASSWORD --data-urlencode 'query=ASK {}' http://localhost:3030/catalog/query > /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CATALOG_HOST: ${CATALOG_HOST:?Set the catalog hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the TLS certificate contact email}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      catalog:
        condition: service_healthy
networks:
  edge:
  index:
    internal: true
volumes:
  fuseki-data:
  caddy-data:
  caddy-config:
